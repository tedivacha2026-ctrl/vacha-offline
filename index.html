</style></head><body><header><b>Vacha Offline</b><small id="state">Datenbank wird geöffnet …</small></header><main><div id="message" role="status"></div><details id="setup"><summary>Verbindung &amp; Mitarbeiter</summary><label>Web-App-Adresse (endet auf /exec)</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec"><label>Team-Zugangscode</label><input id="code" type="password" autocomplete="off"><label>Mitarbeiterkürzel</label><input id="who" maxlength="60"><button id="connect">Verbindung speichern &amp; synchronisieren</button><small>Der Zugangscode wird lokal auf diesem Gerät gespeichert. Nur auf einem geschützten Gerät benutzen. Keine Anmeldung bei Gemini nötig.</small></details><button id="sync">Jetzt synchronisieren</button><div class="tabs"><button data-tab="articles">Artikel</button><button data-tab="mhd">MHD-Kontrolle</button><button data-tab="queue">Offene Aufträge</button></div><section id="articles"><h3>Artikelsuche</h3><input id="search" placeholder="Name, Barcode oder Artikel-ID"><label>Barcode fotografieren (wenn unterstützt)</label><input id="scan" type="file" accept="image/*" capture="environment"><button id="new" class="good">+ Neuer Artikel</button><div id="results"></div></section><section id="edit" hidden><h3 id="editTitle">Artikel</h3><label>Barcode / interne Nummer (leer = ohne Barcode)</label><input id="ean" inputmode="numeric"><label>Artikelname</label><input id="name" maxlength="150"><div class="row"><div><label>Preis €</label><input id="price" inputmode="decimal"></div><div><label>Pfand €</label><input id="deposit" inputmode="decimal"></div><div><label>Inhalt</label><input id="quantity" inputmode="decimal"></div><div><label>Einheit</label><select id="unit"><option value="">–</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select></div></div><label>Neue MHD (TTMMJJ / TT.MM.JJJJ; mehrere mit Semikolon)</label><input id="dates" placeholder="080827; 20.09.2027"><small id="ex <script>
'use strict';
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return (c==='x'?r:(r&3)|8).toString(16)}), empty=()=>({config:{},articles:[],rows:[],queue:[],photos:{},fristen:{first:30,second:14},at:''});let db, S=empty(), syncing=false, editing=null, photoDraft='', ready=false;
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('vacha-offline-1',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function read(){return new Promise((res,rej)=>{const r=db.transaction('state').objectStore('state').get('main');r.onsuccess=()=>res(r.result||empty());r.onerror=()=>rej(r.error)})}function persist(next){return new Promise((res,rej)=>{const t=db.transaction('state','readwrite');t.objectStore('state').put(next,'main');t.oncomplete=()=>{S=next;res()};t.onerror=t.onabort=()=>rej(t.error||Error('Speichern fehlgeschlagen'))})}const clone=x=>JSON.parse(JSON.stringify(x));let chain=Promise.resolve();function update(fn){const job=chain.then(async()=>{const n=clone(S);await fn(n);await persist(n);render()});chain=job.catch(()=>{});return job}function msg(t,bad=false){$('message').textContent=t;$('message').className=bad?'warn':'green'}function err(e){msg(e.message||String(e),true)}function act(fn){return (...a)=>Promise.resolve().then(()=>fn(...a)).catch(err)}
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n}function btn(t,fn,cls='secondary'){const b=el('button',t,cls);b.onclick=act(fn);return b}const norm=x=>String(x??'').toLowerCase().trim(), number=v=>{if(v==='')return '';const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0)throw Error('Zahl prüfen');return n}, money=v=>v===''||v==null?'–':Number(v).toFixed(2).replace('.',',')+' €';function date(v){let m,d,y,mo;v=v.trim();if(m=v.match(/^(\d{2})(\d{2})(\d{2})$/)){d=+m[1];mo=+m[2];y=2000+ +m[3]}else if(m=v.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2}|\d{4})$/)){d=+m[1];mo=+m[2];y=+m[3]+(m[3].length===2?2000:0)}else if(m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/)){y=+m[1];mo=+m[2];d=+m[3]}else throw Error('MHD prüfen: '+v);const z=new Date(Date.UTC(y,mo-1,d));if(y<1900||y>2199||z.getUTCDate()!==d||z.getUTCMonth()!==mo-1||z.getUTCFullYear()!==y)throw Error('Ungültiges MHD: '+v);return z.toISOString().slice(0,10)}const fmt=d=>d.split('-').reverse().join('.');function days(d){const n=new Date(), t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((Date.parse(d+'T00:00:00Z')-t)/86400000)}function pending(id){return S.queue.some(o=>o.localId===id||o.data.id===id)}
function view(){const arts=new Map(S.articles.map(a=>[a.id,{...a}])), rows=new Map(S.rows.map(r=>[r.id+'|'+r.date,{...r}]));for(const o of S.queue){const d=o.data,id=o.localId||d.id;if(o.type==='article'){const a=arts.get(id)||{};arts.set(id,{...a,...d,price:d.price===''?(a.price??''):d.price,deposit:d.deposit===''?(a.deposit??''):d.deposit,id,local:true});for(const dt of d.mhds||[])if(!rows.has(id+'|'+dt))rows.set(id+'|'+dt,{id,date:dt,status:'offen',active:true,version:0,local:true})}if(o.type==='status'){const r=rows.get(id+'|'+d.date);if(r){r.local=true;if(d.status!=='kontrolliert'&&d.status!=='undo')r.status=d.status;if(['verkauft','entfernt'].includes(d.status))r.active=false;if(d.status==='redu1')r.currentPrice=d.price;if(d.status==='redu2')r.currentPrice=.2}}}return {arts:[...arts.values()],rows:[...rows.values()]}}
function render(){if(!ready)return;$('state').textContent=(navigator.onLine?'Netz verfügbar':'Offline')+' · '+S.queue.length+' offen · '+(S.at?'Abgleich '+new Date(S.at).toLocaleString('de-DE'):'noch nicht synchronisiert');$('sync').disabled=syncing;const v=view(),q=norm($('search').value), host=$('results');host.replaceChildren();const hits=v.arts.filter(a=>!q||norm(a.name).includes(q)||norm(a.id).includes(q));for(const a of hits.slice(0,100)){const x=el('div',null,'entry');x.append(el('b',a.name),el('small',a.id+' · '+money(a.price)+(a.local?' · lokal':'')),btn('Öffnen',()=>open(a)));host.append(x)}if(!hits.length)host.append(el('small','Keine Artikel gefunden.'));if(hits.length>100)host.append(el('small','Mehr als 100 Treffer – Suche verfeinern.'));const m=$('mrows');m.replaceChildren();const f=$('filter').value,s=norm($('msearch').value), map=new Map(v.arts.map(a=>[a.id,a]));for(const r of v.rows.sort((a,b)=>a.date.localeCompare(b.date))){const a=map.get(r.id);if(!a||s&&!norm(a.name+' '+a.id).includes(s))continue;const n=days(r.date),due=r.active&&(n<0||n<=S.fristen.second&&r.status!=='redu2'||n<=S.fristen.first&&n>S.fristen.second&&!['redu1','redu2','reduziert'].includes(r.status));if(f==='active'&&!r.active||f==='archive'&&r.active||f==='due'&&!due)continue;const x=el('div',null,'entry');x.append(el('b',a.name),el('small',fmt(r.date)+' · '+n+' Tage · '+r.status+(r.local?' · lokal':''),n<0?'red':due?'amber':'green'),el('small','Original '+money(r.originalPrice??a.price)+' · aktuell '+money(r.currentPrice)));if(!pending(r.id)){const sel=el('select');for(const [val,t] of (r.active?[['kontrolliert','Kontrolliert'],['redu1','1. Reduzierung'],['redu2','2. Reduzierung (0,20 €)'],['verkauft','Verkauft'],['entfernt','Entfernt'],['undo','Rückgängig']]:[['undo','Rückgängig']])){const o=el('option',t);o.value=val;sel.append(o)}const b=btn('Status lokal speichern',async()=>{const status=sel.value;let price='';if(status==='redu1'){const p=prompt('Neuer Preis in €');if(p===n function who(){const w=S.config.who?.trim();if(!w||/^[=+@-]/.test(w))throw Error('Mitarbeiterkürzel in Verbindung eintragen und speichern.');return w}
function tab(t){for(const x of ['articles','mhd','queue'])$(x).hidden=x!==t;if(t!=='articles')$('edit').hidden=true;render()}
function label(){const a=$('name').value,p=Number($('price').value.replace(',','.')),q=Number($('quantity').value.replace(',','.')),u=$('unit').value,pf=Number($('deposit').value.replace(',','.'));const base=['g','ml'].includes(u)?q/1000:q;const text=[a,q&&u?q+' '+u:'',$('price').value!==''?money(p):'',base>0&&u&&$('price').value!==''?money(p/base)+' / '+(['g','kg'].includes(u)?'kg':'l'):'',pf>0?'zzgl. '+money(pf)+' Pfand':''].filter(Boolean).join('\n');$('label').textContent=text;return text}
async function open(a){editing=a||null;photoDraft='';$('edit').hidden=false;$('editTitle').textContent=a?'Artikel bearbeiten':'Neuer Artikel';for(const [k,v] of Object.entries({ean:a?.id||'',name:a?.name||'',price:a?.price??'',deposit:a?.deposit??'',quantity:a?.quantity??'',unit:a?.unit||'',dates:''}))$(k).value=v;$('ean').disabled=!!a;$('name').disabled=!!a;$('quantity').disabled=!!a;$('unit').disabled=!!a;$('existing').textContent=a?'Vorhandene MHD: '+view().rows.filter(r=>r.id===a.id&&r.active).map(r=>fmt(r.date)).join(', '):'';$('photo').value='';const p=a&&S.photos[a.id];$('preview').hidden=!p;$('preview').src=p?.data||'';$('save').disabled=!!a&&pending(a.id);if(a&&pending(a.id))msg('Für diesen Artikel gibt es noch einen offenen Auftrag.');label();$('edit').scrollIntoView({block:'start'});if(a?.photoKey&&(!p||p.key!==a.photoKey)&&navigator.onLine&&S.config.url){try{const data=await api('photo',{id:a.id});if(data){await update(n=>{n.photos[a.id]={key:a.photoKey,data}});if(editing===a&&!photoDraft){$('preview').src=data;$('preview').hidden=false}}}catch(e){}}}
async function enqueue(o){if(!ready)throw Error('Datenbank fehlt');await update(n=>n.queue.push(o));msg('Lokal gespeichert. Wird bei Verbindung übertragen.');sync()}
async function save(){const w=who(),a=editing;if(a&&pending(a.id))throw Error('Erst offenen Auftrag synchronisieren');const id=$('ean').value.trim(), name=$('name').value.trim();if(!name||/^[=+@-]/.test(name)||name.length>150)throw Error('Artikelname prüfen');if(!a&&id&&!/^\d{8,14}$/.test(id))throw Error('Barcode muss 8–14 Ziffern haben');if(!a&&id&&view().arts.some(x=>x.id===id))throw Error('Artikel bereits vorhanden');const quantity=number($('quantity').value),unit=$('unit').value;if((quantity==='')!==(!unit)||quantity===0)throw Error('Inhalt und Einheit prüfen');const mhds=[...new Set($('dates').value.split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean).map(date))];if(a&&mhds.some(dt=>view().rows.some(r=>r.id===a.id&&r.date===dt&&!r.active)))throw Error('Archiviertes MHD bitte in der Online-App reaktivieren');const localId=id||'LOCAL-'+uid(), data={id,name,quantity,unit,price:number($('price').value),deposit:number($('deposit').value),mhds,who:w};const op={uid:uid(),type:'article',localId,data,base:a?{price:a.price,deposit:a.deposit}:null};await update(n=>{n.queue.push(op);if(photoDraft){n.photos[localId]={key:'pending',data:photoDraft};n.queue.push({uid:uid(),type:'photo',localId,data:{id,basePhoto:a?.photoKey||'',photo:photoDraft},depends:op.uid})}});$('edit').hidden=true;msg('Lokal gespeichert.');sync()}
async function api(action,data={}){const {url,code}=S.config;if(!url||!code)throw Error('Verbindung zuerst einrichten');const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),45000);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,code,...data}),redirect:'follow',credentials:'omit',signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok){const e=Error(j.error||'Serverfehler');e.server=true;throw e}return j.data}finally{clearTimeout(timer)}}
async function sync(){if(!ready||syncing||!navigator.onLine||!S.config.url||!S.config.code)return;syncing=true;render();try{const initial=S.queue.filter(o=>!o.error&&!o.depends).map(o=>o.uid);for(const key of initial){const o=S.queue.find(x=>x.uid===key);if(!o)continue;try{const r=await api('push',{op:o});await update(n=>{n.queue=n.queue.filter(x=>x.uid!==key);for(const x of n.queue)if(x.depends===key){x.depends='';x.data.id=r.id;x.localId=r.id;}if(o.type==='article'&&o.localId!==r.id&&n.photos[o.localId]){n.photos[r.id]=n.photos[o.localId];delete n.photos[o.localId]}})}catch(e){if(!e.server)throw e;await update(n=>{const x=n.queue.find(a=>a.uid===key);if(x)x.error=e.message})}}// Nach Artikelbestätigung freigegebene Fotos ebenfalls übertragen.
const next=S.queue.filter(o=>!o.error&&!o.depends&&o.type==='photo');for(const o of next){try{await api('push',{op:o});await update(n=>{n.queue=n.queue.filter(x=>x.uid!==o.uid)})}catch(e){if(!e.server)throw e;await update(n=>{const x=n.queue.find(a=>a.uid===o.uid);if(x)x.error=e.message})}}const snap=await api('snapshot');if(!Array.isArray(snap.articles)||!Array.isArray(snap.rows))throw Error('Ungültige Serverdaten');await update(n=>{n.articles=snap.articles;n.rows=snap.rows;n.fristen=snap.fristen;n.at=snap.at});msg(S.queue.length?'Abgleich abgeschlossen – offene Konflikte/Aufträge prüfen.':'Synchronisiert – auch Änderungen anderer Mitarbeiter geladen.',!!S.queue.length)}catch(e){msg('Abgleich nicht bestätigt: '+(e.message||e)+'. Lokale Aufträge bleiben erhalten.',true)}finally{syncing=false;render()}}
$('connect').onclick=act(async()=>{if(syncing)throw Error('Abgleich läuft');const url=$('url').value.trim(),code=$('code').value.trim(),w=$('who').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url))throw Error('Bitte die bereitgestellte /exec-Adresse eingeben');if(!code||!w||/^[=+@-]/.test(w))throw Error('Code und Kürzel prüfen');if(S.config.url&&S.config.url!==url&&(S.articles.length||S.queue.length))throw Error('Für eine andere Tabelle bitte eine separate App verwenden');await update(n=>n.config={url,code,who:w});$('setup').open=false;sync()});$('sync').onclick=act(sync);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));for(const k of ['search','msearch','filter'])$(k).oninput=render;for(const k of ['name','price','deposit','quantity','unit'])$(k).oninput=label;$('new').onclick=act(()=>open(null));$('close').onclick=()=>{$('edit').hidden=true};$('save').onclick=act(async()=>{if($('save').disabled)return;$('save').disabled=true;try{await save()}finally{$('save').disabled=false}});$('copy').onclick=act(async()=>{const t=label();try{await navigator.clipboard.writeText(t);msg('Etikett kopiert')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw Error('Bitte Etikettentext manuell kopieren');msg('Etikett kopiert')}});
$('scan').onchange=act(async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!('BarcodeDetector'in window))throw Error('Dieser Browser unterstützt lokale Barcode-Erkennung nicht. Barcode bitte eingeben.');const b=await createImageBitmap(f);try{const codes=await new BarcodeDetector().detect(b);if(!codes.length)throw Error('Kein Barcode erkannt');$('search').value=codes[0].rawValue;tab('articles')}finally{b.close()}});$('photo').onchange=act(async e=>{const f=e.target.files[0];if(!f)return;const b=await createImageBitmap(f), c=document.createElement('canvas'), s=Math.min(1,900/Math.max(b.width,b.height));c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close();photoDraft=c.toDataURL('image/jpeg',.75);$('preview').src=photoDraft;$('preview').hidden=false});$('backup').onclick=act(()=>{const n=clone(S);delete n.config.code;const u=URL.createObjectURL(new Blob([JSON.stringify(n)],{type:'application/json'}));const a=el('a');a.href=u;a.download='Vacha-Offline-Sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)});$('restore').onchange=act(async e=>{if(syncing||S.queue.length)throw Error('Zuerst offene Aufträge synchronisieren');const f=e.target.files[0];if(!f)return;const n=JSON.parse(await f.text());if(!Array.isArray(n.articles)||!Array.isArray(n.rows)||!Array.isArray(n.queue)||!n.photos||!n.fristen)throw Error('Ungültige Sicherung');if(n.config?.url&&S.config.url&&n.config.url!==S.config.url)throw Error('Sicherung gehört zu anderer Verbindung');if(!confirm('Lokalen Datenstand ersetzen?'))return;await update(x=>Object.assign(x,n,{config:S.config}));msg('Sicherung geladen')});window.addEventListener('online',()=>{render();sync()});window.addEventListener('offline',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});setInterval(()=>{if(!document.hidden)sync()},45000);
(async()=>{try{db=await dbOpen();S=await read();ready=true;for(const k of ['url','code','who'])$(k).value=S.config[k]||(k==='url'?'https://script.google.com/macros/s/AKfycbyiRWtgRJWo5F_gMBab2KJuJ6fALukBa0HnPuXgg5XdtzBDTzeo6aYwVCHRLRm6i8ScOw/exec':'');$('setup').open=!S.config.url;render();if(location.protocol==='https:'&&'serviceWorker'in navigator)await navigator.serviceWorker.register('./sw.js').catch(()=>msg('Offline-Installation nicht bestätigt. Browser prüfen.',true));sync()}catch(e){err(Error('Lokaler Speicher nicht verfügbar: '+e.message));$('save').disabled=true}})();
